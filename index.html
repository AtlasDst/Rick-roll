<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Preview</title>
    <meta property="og:title" content="Video Preview">
    <meta property="og:description" content="Watch the video here.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://githubassets.com">
    <meta name="theme-color" content="#FF4757">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; }
        iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: none; pointer-events: none; }
        #unmute-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            cursor: pointer;
        }
        .speaker-box {
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 20px 30px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 15px;
            border: 2px solid #ff4757;
            box-shadow: 0 0 20px rgba(255, 71, 87, 0.5);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Target Frame using explicit JS API toggles -->
    <div id="player"></div>

    <!-- Transparent invisible overlay handler across the screen matrix -->
    <div id="unmute-overlay" onclick="triggerAudio()">
        <div class="speaker-box">
            <span>🔊 Click Anywhere to Unmute</span>
        </div>
    </div>

    <script>
        // Dynamically invoke the formal YouTube IFrame Framework Asynchronously
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '100%',
                width: '100%',
                videoId: 'sqK-jh4TDXo',
                playerVars: {
                    'autoplay': 1,
                    'mute': 1,
                    'loop': 1,
                    'playlist': 'sqK-jh4TDXo',
                    'controls': 0,
                    'rel': 0,
                    'showinfo': 0,
                    'modestbranding': 1
                },
                events: {
                    'onReady': onPlayerReady
                }
            });
        }

        function onPlayerReady(event) {
            event.target.playVideo();
        }

        // Bypasses local PC platform restrictions cleanly by marrying user event interaction directly to the core video element
        function triggerAudio() {
            if (player) {
                player.unMute();
                player.setVolume(100);
                player.playVideo(); // Enforces persistent pipeline loop flow
            }
            document.getElementById('unmute-overlay').style.display = 'none';
        }
    </script>
</body>
</html>
