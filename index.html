<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Meta tags for social previews (Discord, WhatsApp, iMessage) -->
    <title>Leaked Update / Content</title>
    <meta property="og:title" content="Exclusive Leak & Source Material">
    <meta property="og:description" content="Click to view the unreleased repository files and documentation.">
    <meta property="og:image" content="https://githubassets.com">
    <meta name="theme-color" content="#FF4757">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Teto-themed sleek overlay grid */
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a1a 0%, #40101d 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            color: #ffffff;
            text-align: center;
            cursor: pointer;
            padding: 20px;
        }
        #overlay h1 {
            font-size: 2.2rem;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }
        #overlay p {
            color: #b3b3b3;
            margin-bottom: 30px;
            font-size: 1rem;
        }
        #overlay button {
            padding: 16px 36px;
            font-size: 1.1rem;
            font-weight: bold;
            border: 2px solid #ff4d6d;
            border-radius: 8px;
            background-color: transparent;
            color: #ff4d6d;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 77, 109, 0.2);
            transition: all 0.3s ease;
        }
        #overlay button:hover {
            background-color: #ff4d6d;
            color: #1a1a1a;
            box-shadow: 0 0 25px rgba(255, 77, 109, 0.6);
            transform: translateY(-2px);
        }
        /* Full viewport YouTube wrapper */
        .video-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div id="overlay" onclick="startTetoRoll()">
        <h1>Confirm Repository Access</h1>
        <p>You must verify your browser interaction to view the repository player.</p>
        <button>Initialize Terminal</button>
    </div>

    <!-- Embedded Video Container using the YouTube JS API -->
    <div id="video-wrapper" class="video-wrapper">
        <iframe id="teto-video" 
                src="https://www.youtube.com/embed/sqK-jh4TDXo?enablejsapi=1&controls=0&rel=0" 
                allow="autoplay; encrypted-media; picture-in-picture" 
                allowfullscreen>
        </iframe>
    </div>

    <script>
        function startTetoRoll() {
            // Remove the interactive trigger blocker
            document.getElementById('overlay').style.display = 'none';
            
            // Unhide the media container
            const wrapper = document.getElementById('video-wrapper');
            wrapper.style.display = 'block';
            
            // Force play through postMessage framework
            const iframe = document.getElementById('teto-video');
            iframe.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
        }
    </script>
</body>
</html>
