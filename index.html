<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Verification</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #111111 0%, #1a1a1a 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            color: #ffffff;
            text-align: center;
            padding: 20px;
        }
        #overlay h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            font-weight: 600;
        }
        #overlay p {
            color: #aaaaaa;
            margin-bottom: 25px;
            font-size: 1rem;
        }
        #overlay button {
            padding: 14px 32px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            background-color: #ff4757;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.3);
            transition: all 0.2s ease;
        }
        #overlay button:hover {
            background-color: #ff6b81;
            transform: translateY(-1px);
        }
        .video-wrapper {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            visibility: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div id="overlay" onclick="clickPlay()">
        <h1>Interaction Required</h1>
        <p>Click below to verify interaction and initialize media playback.</p>
        <button>Continue to Content</button>
    </div>

    <div id="video-wrapper" class="video-wrapper">
        <div id="player"></div>
    </div>

    <script>
        // Load the IFrame Player API code asynchronously.
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '100%',
                width: '100%',
                videoId: 'sqK-jh4TDXo',
                playerVars: {
                    'autoplay': 1,
                    'controls': 1,
                    'rel': 0,
                    'showinfo': 0,
                    'modestbranding': 1,
                    'mute': 1,
                    'playlist': 'sqK-jh4TDXo',
                    'loop': 1
                },
                events: {
                    'onReady': onPlayerReady
                }
            });
        }

        function onPlayerReady(event) {
            event.target.playVideo();
        }

        function clickPlay() {
            // Hide overlay
            document.getElementById('overlay').style.display = 'none';
            // Show video
            document.getElementById('video-wrapper').style.visibility = 'visible';
            
            if (player && typeof player.unMute === 'function') {
                player.unMute();
                player.playVideo();
            }
        }
    </script>
</body>
</html>
